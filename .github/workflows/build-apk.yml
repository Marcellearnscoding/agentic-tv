# Builds the TV app on every push. On main, it also publishes the APK
# as the "latest" release, which scripts/install.sh downloads.
name: Build TV app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk agentic-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: agentic-tv-apk
          path: tv-app/agentic-tv.apk

      - name: Publish as "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest agentic-tv.apk \
            --title "Latest TV app" \
            --notes "Built automatically from ${GITHUB_SHA::7}. Install with scripts/install.sh" \
            --prerelease
